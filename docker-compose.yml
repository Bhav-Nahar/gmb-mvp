version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: gmb_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-gmb_db}
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gmb_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: gmb_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmb_backend
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - CARD_REQUIRED_ONBOARDING=${CARD_REQUIRED_ONBOARDING:-false}
      - INDIA_PHONE_TRIAL=${INDIA_PHONE_TRIAL:-true}
      - ROW_PHONE_TRIAL=${ROW_PHONE_TRIAL:-false}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - WHATSAPP_SYSTEM_TOKEN=${WHATSAPP_SYSTEM_TOKEN:-}
      - WHATSAPP_TEST_PHONE_NUMBER_ID=${WHATSAPP_TEST_PHONE_NUMBER_ID:-}
      - WHATSAPP_TEST_WABA_ID=${WHATSAPP_TEST_WABA_ID:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - WHATSAPP_ES_CONFIG_ID=${WHATSAPP_ES_CONFIG_ID:-}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      - REVIEW_REQUEST_COOLDOWN_HOURS=${REVIEW_REQUEST_COOLDOWN_HOURS:-24}
      - REVIEW_LINK_BASE_URL=${REVIEW_LINK_BASE_URL:-https://pinzo.io}
      - DEMO_LOGIN_ENABLED=${DEMO_LOGIN_ENABLED:-false}
      - DEMO_LOGIN_EMAIL=${DEMO_LOGIN_EMAIL:-}
      - DEMO_LOGIN_PASSWORD_HASH=${DEMO_LOGIN_PASSWORD_HASH:-}
      - FRONTEND_URL=${FRONTEND_URL}
      - ADDITIONAL_CORS_ORIGINS=${ADDITIONAL_CORS_ORIGINS:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - LEAD_EMAIL_FROM=${LEAD_EMAIL_FROM:-Pinzo Leads <leads@pinzo.io>}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - SUPERADMIN_EMAILS=${SUPERADMIN_EMAILS:-}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN}
      - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD}
      - DATAFORSEO_BASE_URL=${DATAFORSEO_BASE_URL}
      - AEO_PROVIDER=${AEO_PROVIDER:-mock}
      - AEO_LOCATION_CODE=${AEO_LOCATION_CODE:-2356}
      - GSC_SERVICE_ACCOUNT_JSON=${GSC_SERVICE_ACCOUNT_JSON:-}
      - GSC_PROPERTY_URL=${GSC_PROPERTY_URL:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmb_celery_worker
    restart: always
    command: celery -A app.worker.celery worker --pool=threads --concurrency=10 --loglevel=info --without-gossip --without-mingle --without-heartbeat
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=${APP_ENV:-development}
      - CARD_REQUIRED_ONBOARDING=${CARD_REQUIRED_ONBOARDING:-false}
      - INDIA_PHONE_TRIAL=${INDIA_PHONE_TRIAL:-true}
      - ROW_PHONE_TRIAL=${ROW_PHONE_TRIAL:-false}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - WHATSAPP_SYSTEM_TOKEN=${WHATSAPP_SYSTEM_TOKEN:-}
      - WHATSAPP_TEST_PHONE_NUMBER_ID=${WHATSAPP_TEST_PHONE_NUMBER_ID:-}
      - WHATSAPP_TEST_WABA_ID=${WHATSAPP_TEST_WABA_ID:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - WHATSAPP_ES_CONFIG_ID=${WHATSAPP_ES_CONFIG_ID:-}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      - REVIEW_REQUEST_COOLDOWN_HOURS=${REVIEW_REQUEST_COOLDOWN_HOURS:-24}
      - REVIEW_LINK_BASE_URL=${REVIEW_LINK_BASE_URL:-https://pinzo.io}
      - DEMO_LOGIN_ENABLED=${DEMO_LOGIN_ENABLED:-false}
      - DEMO_LOGIN_EMAIL=${DEMO_LOGIN_EMAIL:-}
      - DEMO_LOGIN_PASSWORD_HASH=${DEMO_LOGIN_PASSWORD_HASH:-}
      - FRONTEND_URL=${FRONTEND_URL}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - LEAD_EMAIL_FROM=${LEAD_EMAIL_FROM:-Pinzo Leads <leads@pinzo.io>}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN}
      - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD}
      - DATAFORSEO_BASE_URL=${DATAFORSEO_BASE_URL}
      - AEO_PROVIDER=${AEO_PROVIDER:-mock}
      - AEO_LOCATION_CODE=${AEO_LOCATION_CODE:-2356}
      # Server-side conversions run in the worker, so it needs these too.
      - META_PIXEL_ID=${META_PIXEL_ID}
      - META_CAPI_ACCESS_TOKEN=${META_CAPI_ACCESS_TOKEN}
      - META_CAPI_API_VERSION=${META_CAPI_API_VERSION:-v21.0}
      - GOOGLE_ADS_DEVELOPER_TOKEN=${GOOGLE_ADS_DEVELOPER_TOKEN}
      - GOOGLE_ADS_CLIENT_ID=${GOOGLE_ADS_CLIENT_ID}
      - GOOGLE_ADS_CLIENT_SECRET=${GOOGLE_ADS_CLIENT_SECRET}
      - GOOGLE_ADS_REFRESH_TOKEN=${GOOGLE_ADS_REFRESH_TOKEN}
      - GOOGLE_ADS_CUSTOMER_ID=${GOOGLE_ADS_CUSTOMER_ID}
      - GOOGLE_ADS_LOGIN_CUSTOMER_ID=${GOOGLE_ADS_LOGIN_CUSTOMER_ID}
      - GOOGLE_ADS_CONVERSION_ACTION_ID=${GOOGLE_ADS_CONVERSION_ACTION_ID}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmb_celery_beat
    restart: always
    command: celery -A app.worker.celery beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=${APP_ENV:-development}
      - CARD_REQUIRED_ONBOARDING=${CARD_REQUIRED_ONBOARDING:-false}
      - INDIA_PHONE_TRIAL=${INDIA_PHONE_TRIAL:-true}
      - ROW_PHONE_TRIAL=${ROW_PHONE_TRIAL:-false}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - WHATSAPP_SYSTEM_TOKEN=${WHATSAPP_SYSTEM_TOKEN:-}
      - WHATSAPP_TEST_PHONE_NUMBER_ID=${WHATSAPP_TEST_PHONE_NUMBER_ID:-}
      - WHATSAPP_TEST_WABA_ID=${WHATSAPP_TEST_WABA_ID:-}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET:-}
      - WHATSAPP_ES_CONFIG_ID=${WHATSAPP_ES_CONFIG_ID:-}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      - REVIEW_REQUEST_COOLDOWN_HOURS=${REVIEW_REQUEST_COOLDOWN_HOURS:-24}
      - REVIEW_LINK_BASE_URL=${REVIEW_LINK_BASE_URL:-https://pinzo.io}
      - DEMO_LOGIN_ENABLED=${DEMO_LOGIN_ENABLED:-false}
      - DEMO_LOGIN_EMAIL=${DEMO_LOGIN_EMAIL:-}
      - DEMO_LOGIN_PASSWORD_HASH=${DEMO_LOGIN_PASSWORD_HASH:-}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN}
      - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD}
      - DATAFORSEO_BASE_URL=${DATAFORSEO_BASE_URL}
      - AEO_PROVIDER=${AEO_PROVIDER:-mock}
      - AEO_LOCATION_CODE=${AEO_LOCATION_CODE:-2356}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* must be available at build time to be inlined into the bundle.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_RAZORPAY_KEY: ${RAZORPAY_KEY_ID}
        NEXT_PUBLIC_CARD_REQUIRED_ONBOARDING: ${NEXT_PUBLIC_CARD_REQUIRED_ONBOARDING:-false}
        NEXT_PUBLIC_DEMO_LOGIN: ${NEXT_PUBLIC_DEMO_LOGIN:-false}
    container_name: gmb_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - NEXT_PUBLIC_RAZORPAY_KEY=${RAZORPAY_KEY_ID}
      - NEXT_PUBLIC_CARD_REQUIRED_ONBOARDING=${NEXT_PUBLIC_CARD_REQUIRED_ONBOARDING:-false}
      - NEXT_PUBLIC_DEMO_LOGIN=${NEXT_PUBLIC_DEMO_LOGIN:-false}
      - REVALIDATE_SECRET=${REVALIDATE_SECRET}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
